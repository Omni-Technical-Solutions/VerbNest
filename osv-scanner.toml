ignoreUntil = 2026-12-31
reason = "stack overflow in url 2.5.8 Url::origin() on deeply nested blob: URLs; reached only through fjs' fetch/URL modules, which VerbNest does not enable (JsBuiltinOptions() has no builtins), so scripts cannot build such a URL; fixed in url 2.5.9, wait for an fjs release that updates its lockfile"
