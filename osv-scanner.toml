[[IgnoredVulns]]
id = "RUSTSEC-2026-0385"
ignoreUntil = 2026-12-31
reason = "timing variability in constant-time code of crypto-bigint/ctutils, reached only through fjs' crypto module (p256/p384 in llrt_crypto); VerbNest enables no fjs builtins, so scripts have no crypto module; wait for an fjs release"

