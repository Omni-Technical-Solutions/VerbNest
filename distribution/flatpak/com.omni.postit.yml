# Draft Flathub manifest. Not built yet: needs a Linux machine, a real source
# URL and commit, and the offline Dart/Flutter dependency sources that Flathub
# requires (see https://docs.flathub.org/docs/for-app-authors/ and the
# flatpak-flutter helper).
app-id: com.omni.postit
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
command: postit_app
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --talk-name=org.freedesktop.secrets
modules:
  - name: postit
    buildsystem: simple
    build-commands:
      - cp -r bundle /app/postit
      - install -Dm644 distribution/flatpak/com.omni.postit.desktop /app/share/applications/com.omni.postit.desktop
      - install -Dm644 distribution/flatpak/com.omni.postit.metainfo.xml /app/share/metainfo/com.omni.postit.metainfo.xml
      - install -Dm644 assets/icon/postit_icon_512.png /app/share/icons/hicolor/512x512/apps/com.omni.postit.png
      - mkdir -p /app/bin && ln -s /app/postit/postit_app /app/bin/postit_app
    sources:
      - type: git
        url: https://example.invalid/postit.git   # replace
        tag: v0.24.0
