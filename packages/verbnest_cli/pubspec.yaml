name: verbnest_cli
description: Command-line runner for Verbnest workspaces. No Flutter code.
version: 0.45.0
publish_to: none
resolution: workspace

environment:
  sdk: ^3.13.4

executables:
  verbnest:
  vn: verbnest

dependencies:
  args: ^2.5.0
  verbnest_core: any
  verbnest_http: any
  verbnest_runner: any
  verbnest_script: any
  verbnest_storage: any

dev_dependencies:
  lints: ^6.0.0
  test: ^1.25.6
  test_server: any
