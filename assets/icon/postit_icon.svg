<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F59E0B"/>
      <stop offset="0.55" stop-color="#EA580C"/>
      <stop offset="1" stop-color="#9A3412"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.62" cy="0.36" r="0.42">
      <stop offset="0" stop-color="#FDE68A" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#FDE68A" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background tile -->
  <rect width="1024" height="1024" rx="224" fill="url(#bg)"/>
  <rect width="1024" height="1024" rx="224" fill="url(#sun)"/>

  <!-- Ground -->
  <path d="M120 868 Q512 820 904 868" fill="none" stroke="#1C1917" stroke-opacity="0.35" stroke-width="18" stroke-linecap="round"/>

  <!-- Speed lines trailing the throw -->
  <g stroke="#FFF7ED" stroke-opacity="0.75" stroke-width="14" stroke-linecap="round">
    <line x1="92" y1="372" x2="192" y2="340"/>
    <line x1="112" y1="428" x2="184" y2="405"/>
  </g>

  <g fill="#1C1917" stroke="#1C1917" stroke-linecap="round" stroke-linejoin="round">
    <!-- Spear shaft -->
    <line x1="180" y1="300" x2="826" y2="96" stroke-width="18"/>
    <!-- Spear blade (leaf shaped, points up-right) -->
    <path d="M812 101 Q846 56 918 64 Q876 112 812 101 Z" stroke-width="6"/>

    <!-- Back leg -->
    <polyline points="432,600 332,716 226,838" fill="none" stroke-width="62"/>
    <!-- Torso, leaning into the throw -->
    <line x1="458" y1="400" x2="432" y2="600" stroke-width="104"/>
    <!-- Front leg, lunging -->
    <polyline points="440,606 570,700 616,846" fill="none" stroke-width="62"/>
    <!-- Throwing arm, cocked back, hand on the shaft -->
    <polyline points="430,420 338,372 380,246" fill="none" stroke-width="52"/>
    <!-- Head -->
    <circle cx="486" cy="322" r="56" stroke="none"/>
    <!-- Headband plume -->
    <path d="M446 300 Q396 262 368 280 Q404 304 444 318 Z" stroke-width="6"/>
    <path d="M446 316 Q400 306 380 326 Q414 332 446 330 Z" stroke-width="6"/>
    <!-- Hide skirt -->
    <path d="M384 584 L484 584 L512 668 L360 668 Z" stroke-width="10"/>
    <!-- Shield arm -->
    <line x1="480" y1="430" x2="590" y2="470" stroke-width="48"/>
  </g>

  <!-- Oval cowhide shield -->
  <g transform="rotate(-12 612 496)">
    <ellipse cx="612" cy="496" rx="78" ry="138" fill="#FFF7ED" stroke="#1C1917" stroke-width="16"/>
    <ellipse cx="590" cy="430" rx="22" ry="30" fill="#1C1917"/>
    <ellipse cx="636" cy="560" rx="26" ry="36" fill="#1C1917"/>
    <ellipse cx="588" cy="560" rx="12" ry="16" fill="#1C1917"/>
    <!-- Central stick -->
    <line x1="612" y1="330" x2="612" y2="662" stroke="#1C1917" stroke-width="14" stroke-linecap="round"/>
  </g>
</svg>
