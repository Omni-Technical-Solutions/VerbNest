name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  packages:
    name: packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - if: matrix.os == 'ubuntu-latest'
        run: dart format --output=none --set-exit-if-changed packages test_server apps/postit_app/lib apps/postit_app/test
      - run: dart analyze packages test_server
      - name: Package tests
        shell: bash
        run: |
          for p in postit_core postit_http postit_storage postit_import postit_runner postit_script postit_cli; do
            (cd packages/$p && dart test)
          done

  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
        working-directory: apps/postit_app
      - run: flutter test
        working-directory: apps/postit_app

  build:
    name: build (${{ matrix.name }})
    needs: [packages, app]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            build: flutter build linux --release
            test: ../../scripts/ci_integration.sh linux postit_app integration_test/platform_test.dart integration_test/workspace_test.dart integration_test/script_test.dart integration_test/auth_test.dart
          - name: windows
            os: windows-latest
            build: flutter build windows --release
            test: ../../scripts/ci_integration.sh windows postit_app integration_test/platform_test.dart integration_test/workspace_test.dart integration_test/script_test.dart integration_test/auth_test.dart
          - name: macos
            os: macos-latest
            build: flutter build macos --release
            test: ../../scripts/ci_integration.sh macos PostIt
          - name: android
            os: ubuntu-latest
            build: flutter build apk --release
            test: ''
          - name: ios
            os: macos-latest
            build: flutter build ios --release --no-codesign
            test: ''
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        if: matrix.name == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev xvfb
      # The script engine (fjs) is Rust; Linux, Windows and Android build it
      # from source. Apple targets use its signed prebuilt binaries.
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - run: flutter pub get
      - run: ${{ matrix.build }}
        working-directory: apps/postit_app
      - name: Integration tests
        if: matrix.test != ''
        shell: bash
        run: ${{ matrix.test }}
        working-directory: apps/postit_app
      - uses: actions/upload-artifact@v4
        if: matrix.name == 'android'
        with:
          name: postit-android-apk
          path: apps/postit_app/build/app/outputs/flutter-apk/app-release.apk
