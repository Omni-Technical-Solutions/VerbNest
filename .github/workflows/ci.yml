name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed packages test_server apps/postit_app/lib apps/postit_app/test
      - run: dart analyze packages test_server
      - name: Package tests
        run: |
          for p in postit_core postit_http postit_storage postit_import; do
            (cd packages/$p && dart test)
          done

  app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
        working-directory: apps/postit_app
      - run: flutter test
        working-directory: apps/postit_app

  build:
    name: build (${{ matrix.name }})
    needs: [packages, app]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            build: flutter build linux --release
            test: xvfb-run -a flutter test integration_test/platform_test.dart integration_test/workspace_test.dart -d linux
          - name: windows
            os: windows-latest
            build: flutter build windows --release
            test: flutter test integration_test/platform_test.dart integration_test/workspace_test.dart -d windows
          - name: macos
            os: macos-latest
            build: flutter build macos --release
            test: flutter test integration_test -d macos
          - name: android
            os: ubuntu-latest
            build: flutter build apk --release
            test: ''
          - name: ios
            os: macos-latest
            build: flutter build ios --release --no-codesign
            test: ''
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        if: matrix.name == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev xvfb
      - run: flutter pub get
      - run: ${{ matrix.build }}
        working-directory: apps/postit_app
      - name: Integration tests
        if: matrix.test != ''
        run: ${{ matrix.test }}
        working-directory: apps/postit_app
      - uses: actions/upload-artifact@v4
        if: matrix.name == 'android'
        with:
          name: postit-android-apk
          path: apps/postit_app/build/app/outputs/flutter-apk/app-release.apk
