name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  packages:
    name: packages (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - if: matrix.os == 'ubuntu-latest'
        run: dart format --output=none --set-exit-if-changed packages test_server apps/verbnest_app/lib apps/verbnest_app/test
      - run: dart analyze packages test_server
      - name: Function size gate
        if: matrix.os == 'ubuntu-latest'
        run: python3 scripts/complexity_report.py --check
      - name: Package tests
        shell: bash
        run: |
          for p in verbnest_core verbnest_http verbnest_storage verbnest_import verbnest_runner verbnest_script verbnest_cli; do
            (cd packages/$p && dart test)
          done

  app:
    name: app (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
        working-directory: apps/verbnest_app
      # Golden pictures are made on macOS; text anti-aliasing differs on other
      # systems, so only macOS compares them and the others skip them.
      - name: Tests (no goldens)
        if: matrix.os != 'macos-latest'
        run: flutter test --exclude-tags golden
        working-directory: apps/verbnest_app
      - name: Tests (goldens)
        if: matrix.os == 'macos-latest'
        run: flutter test --tags golden
        working-directory: apps/verbnest_app

  build:
    name: build (${{ matrix.name }})
    needs: [packages, app]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
            build: flutter build linux --release
            test: ../../scripts/ci_integration.sh linux verbnest_app integration_test/platform_test.dart integration_test/workspace_test.dart integration_test/script_test.dart integration_test/auth_test.dart integration_test/pdf_test.dart
          - name: windows
            os: windows-latest
            build: flutter build windows --release
            test: ../../scripts/ci_integration.sh windows verbnest_app integration_test/platform_test.dart integration_test/workspace_test.dart integration_test/script_test.dart integration_test/auth_test.dart integration_test/pdf_test.dart
          - name: macos
            os: macos-latest
            build: flutter build macos --release
            test: ../../scripts/ci_integration.sh macos VerbNest
          - name: android
            os: ubuntu-latest
            build: flutter build apk --release
            test: ''
          - name: ios
            os: macos-latest
            build: flutter build ios --release --no-codesign
            test: ''
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        if: matrix.name == 'android'
        with:
          distribution: temurin
          java-version: '17'
      - name: Linux build dependencies
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libsecret-1-dev libjsoncpp-dev xvfb
      # The script engine (fjs) is Rust; Linux, Windows and Android build it
      # from source. Apple targets use its signed prebuilt binaries.
      - name: Free disk space for the emulator
        if: matrix.name == 'android'
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal
      - run: flutter pub get
      - run: ${{ matrix.build }}
        working-directory: apps/verbnest_app
      - name: Integration tests
        if: matrix.test != ''
        shell: bash
        run: ${{ matrix.test }}
        working-directory: apps/verbnest_app
      - name: Boot iOS simulator
        if: matrix.name == 'ios'
        run: |
          udid=$(xcrun simctl list devices available | grep -m1 'iPhone' | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          xcrun simctl boot "$udid"
          echo "SIM_UDID=$udid" >> "$GITHUB_ENV"
      - name: iOS integration tests
        if: matrix.name == 'ios'
        continue-on-error: true
        run: ../../scripts/ci_integration.sh "$SIM_UDID" - integration_test/platform_test.dart integration_test/vault_test.dart integration_test/pdf_test.dart
        working-directory: apps/verbnest_app
      - name: Enable KVM
        if: matrix.name == 'android'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android integration tests
        if: matrix.name == 'android'
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          arch: x86_64
          disk-size: 4096M
          working-directory: apps/verbnest_app
          script: ../../scripts/ci_integration.sh emulator-5554 - integration_test/platform_test.dart integration_test/vault_test.dart integration_test/pdf_test.dart
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.name == 'android'
        with:
          name: verbnest-android-apk
          path: apps/verbnest_app/build/app/outputs/flutter-apk/app-release.apk
